name: Learning feedback
description: Share what helped, what was unclear, and what could improve.
title: "[Feedback]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve this guide. Short, honest feedback is welcome.

  - type: dropdown
    id: experience
    attributes:
      label: Python experience
      description: How would you describe your experience before using the guide?
      options:
        - I am new to Python
        - I know Python basics
        - I have built a few Python projects
        - I am an experienced Python developer
    validations:
      required: true

  - type: dropdown
    id: context
    attributes:
      label: How did you use the guide?
      options:
        - During a class or workshop
        - For self-study
        - While setting up a project
        - As reference material
        - In another way
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Relevant chapter or page
      description: Add a page title or URL if your feedback concerns one place.
      placeholder: "Example: Static type checking with mypy"

  - type: textarea
    id: helpful
    attributes:
      label: What was helpful?
      placeholder: Tell us what made a concept or task easier to understand.

  - type: textarea
    id: unclear
    attributes:
      label: What was unclear or difficult?
      placeholder: Mention missing context, confusing wording, or a step that was hard to follow.

  - type: textarea
    id: feedback
    attributes:
      label: What should we improve?
      description: A small concrete suggestion is especially useful.
      placeholder: Tell us the most important change you would make.
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included passwords, tokens, or private personal information.
          required: true
